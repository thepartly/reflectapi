[package]
name = "reflectapi-codegen-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Codegen behind a bytes-in, bytes-out boundary, built for wasm32 and run by check.mjs"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/main.rs"

[dependencies]
reflectapi = { path = "../../../reflectapi", default-features = false, features = ["codegen"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = "s"
