[package]
name = "reflectapi-conformance-rust"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../../../target/conformance/rust/generated.rs"

[dependencies]
reflectapi = { path = "../../../../reflectapi", features = ["rt", "rt-sse"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[features]
reqwest = []
