[project]
name = "reflectapi-demo-python-client"
version = "0.1.0"
description = "Generated Python client for ReflectAPI demo"
requires-python = ">=3.12"
dependencies = ["reflectapi-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_client"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pyright==1.1.414", "pytest>=8.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.12.5"]

[tool.uv.sources]
reflectapi-runtime = { path = "../../../reflectapi-python-runtime", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
include = ["api_client", "../../target/codegen-coverage-client/codegen_coverage_client"]
typeCheckingMode = "basic"
# Namespace packages alias each other via `sys.modules` and `_rebuild.py`
# assignments that static checkers cannot follow.
reportAttributeAccessIssue = false
executionEnvironments = [
  # Root-level `_ReflectapiDeferredNamespace()` placeholders appear in
  # annotations; only the coverage fixtures exercise that layout.
  { root = "../../target/codegen-coverage-client", reportInvalidTypeForm = false },
  { root = "." },
]
