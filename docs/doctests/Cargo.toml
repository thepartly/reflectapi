# Compiles and runs the Rust examples in the book as doctests:
#   cargo test --manifest-path docs/doctests/Cargo.toml --doc
# The examples can use the dependencies below.
[package]
name = "reflectapi-book-doctests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
reflectapi = { path = "../../reflectapi", features = ["builder", "axum", "codegen", "rt", "reqwest", "url", "chrono", "uuid", "msgpack", "json"] }
reflectapi-conventions = { path = "../../reflectapi-conventions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"
http = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
tower = { version = "0.5", features = ["util"] }
