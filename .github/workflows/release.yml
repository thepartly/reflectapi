name: Release

# Adapted from https://github.com/thepartly/awa release.yml.
#
# Triggered by pushing a `v*` tag (e.g. `v0.17.2`, `v0.18.0-alpha.1`).
# Stable tags publish full releases; prerelease versions are marked as
# GitHub pre-releases automatically.
#
# All publish jobs require successful main-push CI for the tagged SHA,
# matching package/dependency versions, and a nonempty changelog section.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  # ─── Version-consistency gate ────────────────────────────────────────
  # Fails if the git tag, the Rust workspace versions, or the Python
  # runtime version disagree. Everything else needs this job.
  version-check:
    name: Verify version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.versions.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?event=push&branch=main&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq ".workflow_runs | any(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")")
          if [ "$passed" != "true" ]; then
            echo "::error::No successful main-push CI run exists for tagged commit ${GITHUB_SHA}; wait for CI before tagging."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches all package versions
        id: versions
        shell: bash
        # SemVer (Cargo) and PEP 440 (Python) spell pre-releases
        # differently — `0.17.2-alpha.1` vs `0.17.2a1`. We compare both
        # against the tag using `packaging.version.Version`, which
        # accepts both forms and normalises before equality.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet packaging
          python3 - <<'PY'
          import ast, os, re, sys, tomllib
          from pathlib import Path
          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          expected_str = tag.removeprefix("v")
          try:
              expected = Version(expected_str)
          except InvalidVersion as e:
              print(f"::error::tag '{tag}' is not a valid version: {e}")
              sys.exit(1)
          print(f"Git tag:          {tag}")
          print(f"Expected version: {expected}")

          def cargo_version(path: str) -> str | None:
              with open(path, "rb") as f:
                  data = tomllib.load(f)
              return (
                  data.get("package", {}).get("version")
                  or data.get("workspace", {}).get("package", {}).get("version")
              )

          def pyproject_version(path: str) -> str | None:
              with open(path, "rb") as f:
                  data = tomllib.load(f)
              return data.get("project", {}).get("version")

          checks = [
              ("reflectapi/Cargo.toml", cargo_version("reflectapi/Cargo.toml")),
              ("reflectapi-derive/Cargo.toml", cargo_version("reflectapi-derive/Cargo.toml")),
              ("reflectapi-schema/Cargo.toml", cargo_version("reflectapi-schema/Cargo.toml")),
              ("reflectapi-cli/Cargo.toml", cargo_version("reflectapi-cli/Cargo.toml")),
              ("reflectapi-python-runtime/pyproject.toml", pyproject_version("reflectapi-python-runtime/pyproject.toml")),
          ]

          runtime_path = "reflectapi-python-runtime/src/reflectapi_runtime/__init__.py"
          runtime_ast = ast.parse(Path(runtime_path).read_text())
          runtime_versions = [
              ast.literal_eval(node.value)
              for node in runtime_ast.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          ]
          checks.append((runtime_path, runtime_versions[0] if len(runtime_versions) == 1 else None))

          published_crates = {"reflectapi", "reflectapi-derive", "reflectapi-schema", "reflectapi-cli"}

          def internal_requirements(data, prefix=""):
              for key, value in data.items():
                  if key in {"dependencies", "dev-dependencies", "build-dependencies"}:
                      for name, dependency in value.items():
                          package = dependency.get("package", name) if isinstance(dependency, dict) else name
                          if package in published_crates:
                              raw = dependency.get("version") if isinstance(dependency, dict) else dependency
                              yield f"{prefix}{key}.{name}", raw
                  elif isinstance(value, dict):
                      yield from internal_requirements(value, f"{prefix}{key}.")

          for crate in sorted(published_crates):
              path = f"{crate}/Cargo.toml"
              with open(path, "rb") as f:
                  data = tomllib.load(f)
              for dependency, raw in internal_requirements(data):
                  checks.append((f"{path} ({dependency})", raw))

          fail = 0
          for file, raw in checks:
              if raw is None:
                  print(f"::error file={file}::could not read version from {file}")
                  fail = 1
                  continue
              try:
                  parsed = Version(raw)
              except InvalidVersion as e:
                  print(f"::error file={file}::'{raw}' is not a valid version: {e}")
                  fail = 1
                  continue
              if parsed != expected:
                  print(f"::error file={file}::version mismatch: {file} says '{raw}' ({parsed}), tag says '{expected_str}' ({expected})")
                  fail = 1
              else:
                  print(f"ok: {file} = {raw}")

          heading = re.compile(r"^## (?:\[" + re.escape(expected_str) + r"\]|" + re.escape(expected_str) + r")(?=\s|$)")
          lines = Path("CHANGELOG.md").read_text().splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if heading.match(line)]
          notes = ""
          if len(starts) == 1:
              start = starts[0] + 1
              end = next((i for i in range(start, len(lines)) if lines[i].startswith("## ")), len(lines))
              notes = "".join(lines[start:end]).strip()
          if not notes or not any(line.strip() and not line.lstrip().startswith("#") for line in notes.splitlines()):
              print(f"::error file=CHANGELOG.md::expected one nonempty changelog section for {expected_str}")
              fail = 1
          if fail:
              sys.exit(fail)
          Path("release-notes.md").write_text(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"prerelease={str(expected.is_prerelease).lower()}", file=f)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Verify every packaged crate before either registry receives a release.
  # Cargo's staged workspace registry resolves the new internal versions
  # together, even though they are not yet available on crates.io.
  rust-package:
    name: Verify Rust packages
    needs: [version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package and verify all publishable crates
        run: |
          cargo package --workspace --all-features --locked \
            --exclude reflectapi-demo \
            --exclude reflectapi-demo-client \
            --exclude reflectapi-demo-client-generated

  # ─── Publish Rust crates to crates.io ────────────────────────────────
  # Uses crates.io Trusted Publishing (OIDC) — no long-lived
  # CARGO_REGISTRY_TOKEN in the repo. Each crate must be configured on
  # crates.io to trust this repo + workflow + the `release` environment
  # (https://crates.io/docs/trusted-publishing).
  #
  # Order matters: a crate must be on the index before anything that
  # depends on it can be published. The `sleep` between steps lets the
  # index propagate after a successful publish.
  #
  # The token from crates-io-auth-action is short-lived (~30 min), so
  # we re-mint it per crate to stay safe across the inter-publish waits.
  publish-crates:
    name: Publish to crates.io
    needs: [version-check, rust-package, python-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-schema
      - name: Publish reflectapi-schema
        run: cargo publish --package reflectapi-schema --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-schema.outputs.token }}

      - run: sleep 30

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-derive
      - name: Publish reflectapi-derive
        run: cargo publish --package reflectapi-derive --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-derive.outputs.token }}

      - run: sleep 30

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-reflectapi
      - name: Publish reflectapi
        run: cargo publish --package reflectapi --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-reflectapi.outputs.token }}

      - run: sleep 30

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-cli
      - name: Publish reflectapi-cli
        run: cargo publish --package reflectapi-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-cli.outputs.token }}

  # ─── Build the Python runtime sdist + wheel ─────────────────────────
  # `reflectapi-runtime` is pure Python (hatchling), so a single wheel
  # works on all platforms. We still build an sdist for completeness.
  python-build:
    name: Build Python runtime
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: reflectapi-python-runtime
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-runtime-dist
          path: reflectapi-python-runtime/dist/*

  # ─── Publish Python runtime to PyPI ─────────────────────────────────
  # Uses PyPI Trusted Publishing (OIDC) — no API token in the repo.
  # Requires the `release` environment to be configured in repo settings
  # with PyPI as the trusted publisher.
  publish-pypi:
    name: Publish reflectapi-runtime to PyPI
    needs: [rust-package, python-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-runtime-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ─── Publish a GitHub Release ───────────────────────────────────────
  # Uses the matching curated changelog section, validated before publishing.
  github-release:
    name: GitHub Release
    needs: [version-check, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: python-runtime-dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          args=(--verify-tag --title "$tag" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" "${args[@]}"
          fi
          for f in dist/*.tar.gz dist/*.whl; do
            [ -e "$f" ] && gh release upload "$tag" "$f" --clobber
          done
