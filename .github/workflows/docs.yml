name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Test that all documentation examples compile, and build the site
  test-docs:
    name: Test Documentation Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
            docs/doctests/target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Test documentation examples
        run: |
          # Test that all doctests pass
          cargo test --doc --all-features

          # Test that documentation compiles without warnings
          cargo doc --no-deps --all-features --document-private-items

      - name: Test the book's Rust examples
        run: cargo test --manifest-path docs/doctests/Cargo.toml --doc

      - name: Install mdBook
        run: |
          if ! command -v mdbook &> /dev/null; then
            cargo install mdbook --version "~0.4" --locked
          fi

      - name: Build mdBook documentation
        run: |
          cd docs
          mdbook build

      - name: Add sitemap and llms.txt
        run: python3 docs/build-extras.py

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book

  # Publish the site built above to https://reflectapi.rs/
  deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
