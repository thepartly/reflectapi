name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Every job takes its tools from the flake's devShell: the pinned Rust
      # toolchain with the wasm32 target, biome, ruff, node, pnpm and uv.
      # nix-develop exports the shell's environment to every later step.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Test generated Rust enum compatibility
        run: cargo test --manifest-path reflectapi-demo/tests/rust/enum_compatibility/Cargo.toml
      - name: Test generated Rust field presence
        run: cargo test --manifest-path reflectapi-demo/tests/rust/field_presence/Cargo.toml
      - name: Replay serde conformance samples through the generated Rust client
        run: cargo test --manifest-path reflectapi-demo/tests/rust/conformance/Cargo.toml
      # Serving, codegen and generated clients must build for wasm32. The demo
      # client uses reqwest, whose wasm body stream isn't `Send`, and a route
      # there may await such a client (reflectapi/tests/wasm32_routes_not_send.rs).
      - name: Build for wasm32
        run: |
          cargo build -p reflectapi --target wasm32-unknown-unknown --no-default-features --features builder,json
          cargo build -p reflectapi --target wasm32-unknown-unknown --no-default-features --features builder,json --tests
          cargo build -p reflectapi --target wasm32-unknown-unknown --no-default-features --features codegen
          cargo build -p reflectapi --target wasm32-unknown-unknown --no-default-features --features rt,rt-sse,reqwest-middleware
          cargo build -p reflectapi-demo-client-generated --target wasm32-unknown-unknown
      # Codegen is bytes in, bytes out: inside wasm, with no imports, it must
      # give the native build's files. See reflectapi-demo/tests/wasm/check.mjs.
      - name: Run codegen inside wasm
        working-directory: reflectapi-demo/tests/wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cargo build --release --bin native
          node check.mjs target/wasm32-unknown-unknown/release/reflectapi_codegen_wasm.wasm \
            target/release/native ../../reflectapi.json ../../target/field-presence/schema.json \
            ../../target/conformance/reflectapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: enum-compatibility-typescript
          path: |
            reflectapi-demo/target/enum-compatibility/typescript/*.ts
            reflectapi-demo/target/enum-compatibility/fallback_samples.json

      - uses: actions/upload-artifact@v7
        with:
          name: field-presence-typescript
          path: reflectapi-demo/target/field-presence/typescript/*.ts

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-typescript
          path: |
            reflectapi-demo/target/conformance/typescript/*.ts
            reflectapi-demo/target/conformance/samples.json

  typescript-runtime:
    name: TypeScript runtime tests
    needs: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reflectapi-demo/clients/typescript
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/download-artifact@v8
        with:
          name: enum-compatibility-typescript
          path: reflectapi-demo/target/enum-compatibility
      - name: Test generated TypeScript enum compatibility
        run: REFLECTAPI_ENUM_SKIP_GENERATION=1 sh ../../tests/typescript/run.sh

      - uses: actions/download-artifact@v8
        with:
          name: field-presence-typescript
          path: reflectapi-demo/target/field-presence/typescript
      - name: Check generated TypeScript field presence
        run: REFLECTAPI_PRESENCE_SKIP_GENERATION=1 sh ../../tests/typescript/run-field-presence.sh

      - uses: actions/download-artifact@v8
        with:
          name: conformance-typescript
          path: reflectapi-demo/target/conformance
      - name: Check serde conformance samples against the generated TypeScript client
        run: REFLECTAPI_CONFORMANCE_SKIP_GENERATION=1 sh ../../tests/typescript/run-conformance.sh

  python-runtime:
    name: Python runtime tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - name: Run tests
        working-directory: reflectapi-python-runtime
        run: uv run --extra dev pytest -q --no-cov

  # Regenerates the demo Python client from the in-repo schema and
  # imports it. The generated package's strict `_rebuild_models()`
  # runs at import time and raises on any dangling type reference, so
  # this job catches the class of bug where the codegen emits a
  # Python annotation pointing at a symbol it never defined.
  python-codegen-smoke:
    name: Python codegen smoke test (${{ matrix.python-version }}${{ matrix.dependencies == 'minimum' && ', minimum' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            dependencies: latest
            uv-run-args: ""
          - python-version: "3.14"
            dependencies: latest
            uv-run-args: ""
          # Exercise the supported floors against the generated SDK, including
          # recursive PEP 695 models, wire samples, and enum compatibility.
          - python-version: "3.12"
            dependencies: minimum
            uv-run-args: >-
              --isolated --with pydantic==2.10.0 --with httpx==0.25.2
              --with httpcore==1.0.9 --with anyio==4.14.2 --with idna==3.15
          - python-version: "3.14"
            dependencies: minimum
            uv-run-args: >-
              --isolated --with pydantic==2.12.0 --with httpx==0.25.2
              --with httpcore==1.0.9 --with anyio==4.14.2 --with idna==3.15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # --with uses an ephemeral overlay; --locked preserves the tracked lock.
      # These flags must accompany every uv invocation in this job.
      UV_RUN_ARGS: ${{ matrix.uv-run-args }}
    steps:
      - uses: actions/checkout@v6
      # The Python codegen shells out to `ruff format`; different ruff
      # versions wrap long lines differently, so the snapshot-drift
      # check below is meaningless unless CI and local devs use the
      # same ruff version. flake.nix pins it for both.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Report dependency versions
        working-directory: reflectapi-demo/clients/python
        run: |
          uv run --locked $UV_RUN_ARGS python - <<'PY'
          from importlib.metadata import version
          for package in ("pydantic", "httpx", "httpcore", "anyio", "idna"):
              print(f"{package}=={version(package)}")
          PY
      - name: Regenerate demo Python client from schema
        run: |
          cargo run -p reflectapi-cli --quiet -- codegen \
            -s reflectapi-demo/reflectapi.json \
            -o reflectapi-demo/clients/python/api_client \
            -l python --python-package-name api_client --python-sync -f
      - name: Import demo client (triggers strict model_rebuild)
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS python -c "import api_client; print('demo client import OK')"
      - name: Demo snapshot is committed (no drift)
        run: git diff --exit-code reflectapi-demo/clients/python/api_client/
      # Codegen coverage fixtures (recursive types, Python keyword
      # field names, Pydantic-reserved names, ...) live in the
      # integration test at `reflectapi-demo/tests/codegen_coverage.rs`.
      # The test writes a Python client to
      # `target/codegen-coverage-client/`; the next step imports it
      # so `_rebuild_models()` raises on any dangling reference.
      - name: Generate codegen coverage client
        run: cargo test -p reflectapi-demo --test codegen_coverage
      - name: Import codegen coverage client
        working-directory: reflectapi-demo/clients/python
        run: |
          uv run --locked $UV_RUN_ARGS python -c "
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path('../../target/codegen-coverage-client').resolve()))
          import codegen_coverage_client
          print('coverage client import OK')
          "
      - name: Replay serde wire samples through the coverage client
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_wire.py -q -p no:cacheprovider
      - name: Type-check generated clients
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pyright
      - name: Run demo client tests
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest -q
      - name: Generate enum compatibility clients
        run: cargo test -p reflectapi-demo --test enum_compatibility
      - name: Type-check enum compatibility consumer
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pyright --project ../../tests/python/pyrightconfig.json
      - name: Test generated Python enum compatibility
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_enum_compatibility.py -q -p no:cacheprovider
      # Pydantic builds JSON schemas without running the generated models'
      # custom validators and serializers; replay serde's known variants
      # against both the validation and serialization schemas.
      - name: Check generated Python JSON schemas against serde samples
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_json_schema.py -q -p no:cacheprovider
      - name: Generate field-presence clients
        run: cargo test -p reflectapi-demo --test field_presence
      - name: Test generated Python field presence
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_field_presence.py -q -p no:cacheprovider
      # Replays serde's samples for each conformance case through the
      # generated Python client, and validates them against the generated
      # OpenAPI spec. See reflectapi-demo/tests/conformance.rs.
      - name: Generate conformance clients
        run: cargo test -p reflectapi-demo --test conformance
      - name: Check serde conformance samples against the Python client and OpenAPI
        working-directory: reflectapi-demo/clients/python
        run: uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_conformance.py -q -p no:cacheprovider
      - name: Type-check and test distinct types in the generated Python client
        working-directory: reflectapi-demo/clients/python
        run: |
          uv run --locked $UV_RUN_ARGS pyright --project ../../tests/python/pyright-distinct.json
          uv run --locked $UV_RUN_ARGS pytest ../../tests/python/test_distinct_types.py -q -p no:cacheprovider
