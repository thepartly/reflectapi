[package]
name = "reflectapi-format-bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rmp = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
simd-json = "0.15"
rmp-serde = "1.3"
ciborium = "0.2"
minicbor-serde = { version = "0.6", features = ["alloc"] }
flate2 = "1"
brotli = "8"

[profile.release]
codegen-units = 1
lto = "thin"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
