[package]
name = "reflectapi-cli"
version = "0.25.1"
edition = "2021"
default-run = "reflectapi"

license = "Apache-2.0"
description = "CLI for reflectapi"
homepage = "https://github.com/thepartly/reflectapi"
documentation = "https://docs.rs/reflectapi-cli"
repository = "https://github.com/thepartly/reflectapi"
readme = "README.md"

keywords = ["reflectapi", "reflection", "cli", "codegen", "restapi-client"]
categories = ["web-programming", "development-tools", "api-bindings"]

# `cargo binstall reflectapi-cli` downloads the archive the release workflow
# attaches to the GitHub Release (.github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "reflectapi"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[dependencies]
reflectapi = { path = "../reflectapi", version = "0.25.1", features = ["codegen"] }
rouille = "3"

clap = { version = "4.5.3", features = ["derive"] }
clap_derive = "4.5.3"

anyhow = "1.0.81"
serde_json = "1.0.114"

[dev-dependencies]
tempfile = "3"
