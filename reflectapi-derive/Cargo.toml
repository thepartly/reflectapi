[package]
name = "reflectapi-derive"
version = "0.25.2"
edition = "2021"

license = "MIT OR Apache-2.0"
description = "Derive macros for reflectapi"
repository = "https://github.com/thepartly/reflectapi"
homepage = "https://thepartly.github.io/reflectapi/"
documentation = "https://docs.rs/reflectapi-derive"
readme = "README.md"

keywords = ["derive", "macro", "reflection", "codegen", "api"]
categories = ["web-programming", "development-tools", "api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
reflectapi-schema = { path = '../reflectapi-schema', version = "0.25.2" }

proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0.52", features = ["parsing", "extra-traits"] }
serde_derive_internals = "0.29.0"
proc-macro-error = "1.0.0"
